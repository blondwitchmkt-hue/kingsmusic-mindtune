<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>킹스뮤직 사직점 | 마인드튠 체험 상담</title>
<style>
:root{
  --ink:#1B2A41; --ink2:#4A5568; --line:#D8DEE8; --bg:#F3F5F8; --card:#FFFFFF;
  --teal:#1F7A6B; --teal-d:#155E52; --teal-l:#E3F2EF; --amber:#B9741F; --amber-l:#FBF0DF; --warn:#A63D2F; --warn-l:#FBE9E6;
  --slate:#5B6577;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Noto Sans CJK KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2B6CB0;outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App chrome ---------- */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500}
.btn:hover{border-color:#aab4c5}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--teal-d)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warnb{border-color:#d9a79f;color:var(--warn)}
.demo-banner{background:var(--amber-l);color:#6b4413;border-bottom:1px solid #e6cfa5;font-size:14px}
.demo-banner div{max-width:1180px;margin:0 auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.steps{max-width:1180px;margin:0 auto;padding:16px 20px 0;display:flex;gap:8px;overflow-x:auto;list-style:none;margin-block:0}
.steps li{flex:1 0 auto}
.stepbtn{width:100%;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}
.stepbtn .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#E8ECF2;font-weight:700;font-size:12px}
.stepbtn[aria-current="step"]{border-color:var(--teal);background:var(--teal-l);font-weight:700}
.stepbtn[aria-current="step"] .n{background:var(--teal);color:#fff}
.stepbtn.done .n{background:var(--teal-d);color:#fff}
main{max-width:1180px;margin:0 auto;padding:20px 20px 120px}
h1,h2,h3{letter-spacing:-.01em;line-height:1.35}
.page-title{font-size:26px;margin:8px 0 6px}
.lead{color:var(--ink2);margin:0 0 18px;max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--teal-l);border:1px solid #bfe0d9;border-radius:10px;padding:12px 14px;font-size:14px;color:#17463e;margin:0 0 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
.f input,.f select,.f textarea,.field{min-height:46px;padding:10px 12px;border:1px solid #b9c2d1;border-radius:8px;background:#fff;width:100%}
textarea.field{min-height:88px;resize:vertical;line-height:1.55}
.help{font-size:13px;color:var(--ink2);font-weight:400}
.info-box{margin-top:16px;padding:14px 16px;border-radius:10px;background:#F0F3F8;font-size:15px}
.info-box.bad{background:var(--warn-l);color:#6e2a20}

.domain{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.domain h2{margin:0;font-size:20px}
.domain span{font-size:13px;color:var(--ink2)}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink2)}
.bar{flex:1;height:8px;border-radius:99px;background:#DDE3EC;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .2s}

/* ---------- Question card ---------- */
fieldset.q{margin:0 0 14px;padding:18px 18px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-inline-size:0}
fieldset.q.missing{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-l)}
fieldset.q legend{float:left;width:100%;padding:0 0 4px;font-weight:600;font-size:17px;line-height:1.5}
.q .qn{display:inline-block;min-width:26px;color:var(--teal-d);font-weight:700}
.q .hint{clear:both;margin:2px 0 14px;color:var(--ink2);font-size:14px}
.scale{display:flex;justify-content:space-between;align-items:flex-start;gap:2px;max-width:640px;margin:0 auto}
.opt{position:relative;flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;padding:4px 0}
.opt input{position:absolute;opacity:0;width:100%;height:100%;top:0;left:0;margin:0;cursor:pointer}
.dot{display:grid;place-items:center;border-radius:50%;border:2.5px solid var(--c);background:#fff;transition:background .12s,transform .12s}
.opt .dot svg{width:60%;height:60%;opacity:0}
.opt input:checked + .dot{background:var(--c);transform:scale(1.06);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.opt input:checked + .dot svg{opacity:1}
.opt input:focus-visible + .dot{outline:3px solid #2B6CB0;outline-offset:3px}
.o7,.o6,.o5{--c:var(--teal)} .o4{--c:#8b93a3} .o3,.o2,.o1{--c:#6b4fa0}
.o7 .dot,.o1 .dot{width:40px;height:40px}.o6 .dot,.o2 .dot{width:34px;height:34px}.o5 .dot,.o3 .dot{width:28px;height:28px}.o4 .dot{width:24px;height:24px}
.olbl{font-size:11.5px;line-height:1.3;color:var(--ink2);text-align:center;word-break:keep-all}
@media (max-width:640px){
  .olbl{display:none}
  .opt.o7 .olbl,.opt.o1 .olbl{display:block;font-size:11px}
  .o7 .dot,.o1 .dot{width:38px;height:38px}.o6 .dot,.o2 .dot{width:32px;height:32px}.o5 .dot,.o3 .dot{width:27px;height:27px}.o4 .dot{width:23px;height:23px}
}
.sel{text-align:center;margin-top:8px;font-size:14px;min-height:22px;color:var(--ink2)}
.sel b{color:var(--ink)}
.miss-tag{display:none;margin-top:6px;font-size:13px;font-weight:700;color:var(--warn);text-align:center}
.q.missing .miss-tag{display:block}
.q-extra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.na{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid #b9c2d1;border-radius:99px;cursor:pointer;font-size:14px;background:#fff}
.na input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.na .box{width:20px;height:20px;border-radius:50%;border:2px solid #8b93a3;display:grid;place-items:center}
.na .box svg{width:12px;height:12px;opacity:0}
.na:has(input:checked){background:#EEF1F6;border-color:var(--slate);font-weight:700}
.na:has(input:checked) .box{background:var(--slate);border-color:var(--slate)}
.na:has(input:checked) .box svg{opacity:1}
.na:has(input:focus-visible){outline:3px solid #2B6CB0;outline-offset:2px}
.memo{flex:1 1 220px;min-height:44px;padding:8px 12px;border:1px solid #b9c2d1;border-radius:8px;font-size:14px}
.clr{background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:13px;min-height:44px;padding:0 6px}

.ctx .row{margin:0 0 16px;padding:0;border:0;min-inline-size:0}
.ctx legend{font-weight:600;margin-bottom:8px;padding:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border:1.5px solid #b9c2d1;border-radius:10px;cursor:pointer;font-size:14px;background:#fff}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill .mk{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #8b93a3;display:grid;place-items:center}
.pill .mk svg{width:10px;height:10px;opacity:0}
.pill:has(input:checked){border-color:var(--teal);background:var(--teal-l);font-weight:700}
.pill:has(input:checked) .mk{background:var(--teal);border-color:var(--teal)}
.pill:has(input:checked) .mk svg{opacity:1}
.pill:has(input:focus-visible){outline:3px solid #2B6CB0;outline-offset:2px}
.pill.chk .mk{border-radius:5px}
.row.missing legend{color:var(--warn)}
.row.missing legend::after{content:" · 선택이 필요해요";font-weight:700;font-size:13px}
.quote{background:#F0F3F8;border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink2);margin:0 0 16px}

/* ---------- Bottom nav ---------- */
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:20}
.navbar-in{max-width:1180px;margin:0 auto;padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px}
.navbar .mid{font-size:13px;color:var(--ink2);text-align:center;flex:1}

/* ---------- Step 4 / 5 ---------- */
.s4{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.s4{grid-template-columns:1fr}}
.editcol .field-block{margin-bottom:16px}
.field-block label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.field-block .row2{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2);margin-top:2px}
.fit{margin:0 0 12px;padding:10px 14px;border-radius:10px;background:var(--warn-l);color:#6e2a20;font-size:14px;font-weight:600}
.scaler{background:#DDE3EC;border-radius:12px;padding:14px;overflow:hidden}
.scale-wrap{position:relative;overflow:hidden}
.scale-in{transform-origin:top left;position:absolute;left:0;top:0}
.checks{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.check-list{margin:8px 0 0;padding-left:20px}
.check-list button{background:none;border:0;padding:0;color:#1d4f9e;text-decoration:underline;cursor:pointer;font-size:inherit}
dialog{border:0;border-radius:14px;padding:22px;max-width:min(520px,92vw);box-shadow:0 20px 60px rgba(20,30,50,.3)}
dialog::backdrop{background:rgba(20,30,50,.45)}
dialog h2{margin:0 0 8px;font-size:20px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:flex-end}
.demo-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.demo-list button{text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;min-height:44px}
.demo-list button:hover{border-color:var(--teal)}
.demo-list small{display:block;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1B2A41;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
details.calc{margin-top:14px;font-size:13px;color:var(--ink2)}
details.calc table{border-collapse:collapse;margin-top:8px;width:100%}
details.calc td,details.calc th{border:1px solid var(--line);padding:4px 8px;text-align:left}

/* ---------- A4 sheet (screen + print share these rules) ---------- */
.sheet{width:210mm;height:297mm;background:#fff;color:#1B2A41;font-family:var(--font);font-size:9pt;line-height:1.45;position:relative;overflow:hidden;box-shadow:0 2px 14px rgba(20,30,50,.18)}
.sin{height:100%;padding:9mm 10mm 7mm;display:flex;flex-direction:column;gap:3.2mm}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;padding-bottom:2.6mm;border-bottom:1.6pt solid #1F7A6B}
.sh .b{font-size:8.5pt;color:#1F7A6B;font-weight:700;letter-spacing:.02em}
.sh h1{margin:0;font-size:17pt;letter-spacing:-.02em}
.who{margin:0;display:flex;gap:5mm;font-size:8.5pt}
.who div{display:flex;flex-direction:column}
.who dt{font-size:7pt;color:#5B6577}
.who dd{margin:0;font-weight:700}
.stamp{position:absolute;right:10mm;top:3mm;font-size:7pt;font-weight:700;color:#A63D2F;border:1pt solid #A63D2F;padding:0 2mm;border-radius:1mm;background:#fff}
.sheet h2{margin:0 0 1.2mm;font-size:9.5pt;color:#1F7A6B;letter-spacing:-.01em}
.top2{display:grid;grid-template-columns:92mm 1fr;gap:5mm}
.chart svg.hex{display:block;width:100%;height:auto}
.legend{display:flex;gap:4mm;font-size:7.5pt;color:#4A5568;justify-content:center;margin-top:.5mm}
.legend i{display:inline-block;vertical-align:middle;margin-right:1mm}
.disc{margin:1mm 0 0;font-size:7.5pt;color:#4A5568;text-align:center}
.str{margin-bottom:2.2mm;padding:1.8mm 2.5mm;background:#E3F2EF;border-radius:1.5mm}
.str b{display:block;font-size:9.5pt}
.str p,.t p{margin:.6mm 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.t p{margin:0}
table.dt{width:100%;border-collapse:collapse;font-size:8pt}
.dt th,.dt td{padding:.9mm 1.8mm;border-bottom:.5pt solid #D8DEE8;text-align:left}
.dt th{font-size:7.5pt;color:#5B6577;font-weight:600;border-bottom:.8pt solid #9aa5b8}
.dt td.m{color:#A63D2F;font-weight:600}
.dnote{margin:1mm 0 0;font-size:8pt;color:#4A5568}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.box{border:.7pt solid #C7CFDC;border-radius:1.5mm;padding:2mm 2.6mm}
.box h2{margin-bottom:.8mm}
.box p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.stagebig{font-size:10.5pt;font-weight:700;margin:0 0 .6mm}
.ev{font-size:8pt;color:#4A5568;margin-top:.8mm !important}
.memo2{min-height:15mm}
.fine{margin-top:auto;font-size:7pt;color:#5B6577;text-align:center;border-top:.5pt solid #D8DEE8;padding-top:1.6mm}
.sheet ol{margin:0;padding-left:4.5mm}
.sheet li{margin:0 0 .8mm;white-space:pre-wrap;overflow-wrap:anywhere}

#printRoot{display:none}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff !important;margin:0;padding:0}
  body > *:not(#printRoot){display:none !important}
  #printRoot{display:block}
  #printRoot .sheet{box-shadow:none;height:296.4mm;break-after:avoid;break-inside:avoid;page-break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="top-in">
    <div class="brand">킹스뮤직 사직점 | 마인드튠<small>무료 체험 수업 · 첫 상담</small></div>
    <div class="tools">
      <span id="saveState" aria-live="polite">자동 저장 준비됨</span>
      <button class="btn sm" data-act="demo-open">데모 불러오기</button>
      <button class="btn sm warnb" data-act="reset-open">전체 초기화</button>
    </div>
  </div></header>
  <div id="demoBanner" class="demo-banner" hidden><div><b>데모 모드</b><span>지금 보이는 내용은 예시 데이터입니다. 실제 아이 기록과 따로 저장돼요.</span><button class="btn sm" data-act="demo-exit">데모 끝내고 실제 기록으로</button></div></div>
  <nav aria-label="진행 단계"><ol class="steps" id="steps"></ol></nav>
  <main id="view"></main>
</div>
<div class="navbar" id="navbar"><div class="navbar-in">
  <button class="btn" data-act="prev" id="btnPrev">이전</button>
  <div class="mid" id="navMid"></div>
  <button class="btn pri" data-act="next" id="btnNext">다음</button>
</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="dlgDemo"><h2>데모 데이터 불러오기</h2>
  <p style="margin:0;color:var(--ink2);font-size:14px">예시 아이 기록이 데모 모드로 열립니다. 지금까지 입력한 실제 기록은 그대로 보관됩니다.</p>
  <div class="demo-list">
    <button data-act="demo-load:A"><b>데모 A · 편안하게 참여한 아이</b><small>처음부터 끝까지 자연스럽게 참여, 여섯 영역 모두 관찰</small></button>
    <button data-act="demo-load:B"><b>데모 B · 초반엔 낯을 가렸지만 후반에 참여한 아이</b><small>보호자 곁에서 시작해 후반에 직접 시도</small></button>
    <button data-act="demo-load:C"><b>데모 C · 관찰 기회가 부족한 아이</b><small>일부 영역은 추가 관찰로 표시</small></button>
  </div>
  <div class="dlg-actions"><button class="btn" data-act="dlg-close">닫기</button></div>
</dialog>
<dialog id="dlgReset"><h2>전체 초기화</h2>
  <p id="resetMsg" style="margin:0"></p>
  <div class="dlg-actions"><button class="btn" data-act="dlg-close">취소</button><button class="btn pri" style="background:var(--warn);border-color:var(--warn)" data-act="reset-do">초기화하기</button></div>
</dialog>
<div id="printRoot" aria-hidden="true"></div>

<script>
'use strict';
/* =========================================================
   데이터: 영역, 척도, 문항
   ========================================================= */
const DOM=[
 {id:'listen', name:'소리 감지·청음', st:'소리를 귀 기울여 듣는 힘', sd:'작은 소리와 소리의 변화에 귀를 기울이고 반응하는 모습이 보였어요.', goal:'여러 악기의 소리를 듣고 느낌을 나누며 소리 탐색하기', home:'눈을 감고 집 안 소리 3가지 찾기: 가족이 컵·숟가락·열쇠로 소리를 내면 어떤 소리인지 맞혀 봐요.'},

function ageInfo(){
  const c=S.child,y=parseInt(c.birthYear,10),dy=parseInt((c.date||'').slice(0,4),10)||new Date().getFullYear();
  const age=y?dy-y:null,g=c.grade;
  let group=null,warn='';
  if(g==='미취학')group='유치부';
  else if(['초1','초2','초3','초4'].includes(g))group='초등부';
  if(age!=null&&g){
    if(g==='미취학'&&(age<4||age>6))warn=age>6?'미취학인데 연 나이가 7세 이상이에요. 출생연도와 취학 여부를 확인해 주세요.':'연 나이가 4세 미만이에요. 운영 연령(4~6세 유치부)을 확인해 주세요.';
    else if(group==='초등부'&&(age<7||age>10))warn='학년과 출생연도가 맞지 않아 보여요(초등부는 연 나이 7~10세). 확인해 주세요.';

}

function scores(){
  return DOM.map((d,i)=>{
    const p=PARENT_Q.filter(q=>q.d===i).map(q=>S.parent.a[q.id]).filter(isNum);
    const t=TEACHER_Q.filter(q=>q.d===i).map(q=>S.teacher.a[q.id]).filter(isNum);
    const parent=p.length?mean(p):null;
    const teacher=t.length>=2?mean(t):null;
    return{i,parent,teacher,tn:t.length,extra:t.length<2,diff:(parent!=null&&teacher!=null&&Math.abs(parent-teacher)>=2)};
  });
}
function band(v){return v==null?'':v>=6?'자주 보였어요':v>=5?'꽤 보였어요':v>=4?'때때로 보였어요':'조금씩 탐색 중이에요'}
function suggestStage(sc){
  const avail=sc.filter(x=>x.teacher!=null).length;
  if(avail<4)return{key:'defer',limited:true,avail};
  const T=i=>sc[i].teacher;
  const R2=[[0,4.5],[1,4.5]],R3=[...R2,[2,4.5],[5,5]],R4=[...R3,[1,5.5],[3,5.5],[4,5.5]];
  const test=R=>{let ok=true,miss=false;for(const[i,m]of R){if(T(i)==null){miss=true;ok=false}else if(T(i)<m)ok=false}return{ok,miss}};
  let key='1',limited=false;
  for(const[k,R]of[['2',R2],['3',R3],['4',R4]]){
    const r=test(R);
    if(r.ok)key=k;else{limited=r.miss;break}
  }
  return{key,limited,avail};
}

/* =========================================================
   초안 생성 (점수로 단정하지 않고, 입력값 기반의 따뜻한 문장)
   ========================================================= */
function clip(s,n){s=String(s||'').trim();return s.length>n?s.slice(0,n-1)+'…':s}
function memoOf(d){
  const qs=TEACHER_Q.filter(q=>q.d===d).sort((a,b)=>(S.teacher.a[b.id]||0)-(S.teacher.a[a.id]||0));
  for(const q of qs){const m=(S.teacher.m[q.id]||'').trim();if(m&&isNum(S.teacher.a[q.id]))return m}
  return '';
}
function rankDomains(sc){
  return sc.map(x=>({i:x.i,v:x.teacher!=null?x.teacher+0.001*(x.parent||0):(x.parent!=null?x.parent-1.5:-9),t:x.teacher!=null})).sort((a,b)=>b.v-a.v);
}
function drafts(){
  const sc=scores(),st=suggestStage(sc),eff=S.report.stage||st.key,ctx=S.teacher.ctx,name=(S.child.name||'아이').trim();
  const rk=rankDomains(sc),top=rk[0].i;
  const obs=rk.filter(x=>x.t);
  const grow=obs.length?obs[obs.length-1].i:rk[rk.length-1].i;
  const out={};
  // 강점
  const d1=DOM[top];
  const m1=memoOf(top);
  out.s1t=d1.st;
  out.s1d=clip(d1.sd+(m1&&(d1.sd.length+m1.length+8)<=110?' 「'+m1+'」':''),110);
  if(ctx.change==='grow'){
    out.s2t='낯선 곳에서 시도해 보는 힘';
    out.s2d='처음에는 조심스럽게 지켜보다가, 시간이 지나며 직접 시도하는 모습이 늘었어요. 새로운 환경에 스스로 적응해 가는 힘이에요.';
  }else{
    const second=rk.find(x=>x.i!==top)||rk[0],d2=DOM[second.i],m2=memoOf(second.i);
    out.s2t=d2.st;
    out.s2d=clip(d2.sd+(m2&&(d2.sd.length+m2.length+8)<=110?' 「'+m2+'」':''),110);
  }
  // 참여 방식
  const p=[];
  const ce={direct:'공간에 들어와 바로 둘러보며 시작했어요.',watch:'잠시 지켜본 뒤 천천히 다가와 시작했어요.',parent:'보호자 곁에서 먼저 지켜보며 시작했어요.'}[ctx.entry];if(ce)p.push(ce);
  const cc={steady:'수업 내내 비슷한 마음으로 참여했어요.',grow:'초반의 조심스러운 모습에서 후반에는 직접 시도하는 모습으로 이어졌어요.',tired:'후반에는 에너지가 줄어 쉬어 가는 모습도 있었어요.',quiet:'차분하게 자기 속도로 참여했어요.'}[ctx.change];if(cc)p.push(cc);
  const cn={near:'보호자가 가까이 있을 때 더 편안하게 참여했어요.',same:'보호자와의 거리와 상관없이 비슷하게 참여했어요.'}[ctx.near];if(cn)p.push(cn);
  if(ctx.alt==='other'){const ch=(ctx.chips||[]).join(', ');p.push('말 대신 '+(ch||'다른 방식')+'(으)로도 마음을 전했어요.')}
  else if(ctx.alt==='words')p.push('하고 싶은 것을 말로 분명하게 전했어요.');
  out.part=clip(p.length?p.join(' '):'오늘 수업에서 아이가 편안하게 참여한 방식을 적어 주세요.',170);
  // 차이 해석
  const df=sc.filter(x=>x.diff).map(x=>DOM[x.i].name);
  out.diff=df.length?clip(df.join(', ')+' — 집과 새로운 환경에서 다른 모습이 관찰되었습니다. 낯선 곳에서는 모습이 달라질 수 있어 수업 속에서 함께 살펴볼게요.',150):'';
  // 추가 관찰
  const ex=sc.filter(x=>x.extra).map(x=>DOM[x.i].name);
  out.extra=ex.length?clip(ex.join(', ')+' 영역은 오늘 관찰 기회가 적어, 첫 4주 수업에서 천천히 살펴보겠습니다.',130):'오늘 여섯 영역을 모두 살펴볼 수 있었어요. 수업을 이어 가며 더 풍부하게 관찰하겠습니다.';
  // 단계
  if(eff==='defer'){
    out.stageReason=clip('오늘은 관찰 기회가 적었던 영역이 있어, 첫 4주 동안 편안하게 적응하고 탐색한 뒤 시작 단계를 함께 제안드릴게요.',150);
  }else{
    const base={'1':'소리와 활동을 편안하게 탐색하는 경험부터 시작하면 좋겠어요. 새로운 공간에 익숙해질수록 더 다양한 시도가 나올 수 있어요.','2':'들은 소리와 리듬을 따라 하고 바꿔 보려는 모습이 있어, 확장 단계에서 시작하면 좋겠어요.','3':'다른 사람의 소리에 반응하고 차례를 주고받는 모습이 있어, 함께 연주하는 교감 단계에서 시작하면 좋겠어요.','4':'자기 느낌과 생각을 소리로 구성해 보려는 모습이 있어, 표현 단계에서 시작하면 좋겠어요.'}[eff];
    out.stageReason=clip(base+(st.limited&&eff===st.key?' 일부 영역은 추가 관찰 뒤 조정할 수 있어요.':''),150);
  }
  // 근거 장면
  const ev=[];
  const used=eff==='defer'?[0,1,2,3,4,5]:eff==='1'?rk.map(x=>x.i):[0,1,5,2];
  for(const d of used){const m=memoOf(d);if(m&&!ev.includes(m))ev.push(m);if(ev.length>=2)break}
  out.evidence=clip(ev.join(' / '),110);
  // 목표
  const stageGoal={'1':'소리와 활동을 편안하게 탐색하며 수업 환경에 익숙해지기','2':'들은 리듬을 따라 하고 한 부분 바꿔 연주해 보기','3':'선생님·친구와 번갈아 연주하며 서로의 소리에 맞춰 보기','4':'느낌이나 이야기를 떠올려 짧은 소리 이야기 만들어 보기','defer':'첫 4주 동안 편안하게 적응하며 좋아하는 소리와 활동 찾기'}[eff];
  out.g1=clip(sc.some(x=>x.extra)&&eff==='defer'?'아직 만나지 못한 영역을 놀이처럼 만나며 천천히 살펴보기':DOM[grow].goal,70);
  out.g2=clip(stageGoal,70);
  // 횟수 이유
  out.countReason={w1:'새로운 환경에 편안하게 익숙해지는 시간을 충분히 가지며 시작해요.',w2:'경험을 더 자주 쌓으며 활동을 이어 가 볼 수 있어요.','':'첫 4주 모습을 보며 상담에서 함께 정해요.'}[S.report.count||''];
  out.home=clip(DOM[top].home,140);
  out.memo=clip('오늘 '+name+' 친구의 강점으로 「'+out.s1t+'」이 눈에 띄었습니다. 낯선 공간에서도 자기만의 방식으로 소리를 만나는 모습을 응원하며, 첫 4주 동안 천천히 함께 살펴보겠습니다.',230);
  return out;
}

function validate(){
  const m={info:[],parent:[],teacher:[],ctx:[]};
  const c=S.child;
  if(!c.name.trim())m.info.push('이름');
  if(!c.birthYear)m.info.push('출생연도');
  if(!c.grade)m.info.push('현재 학년 또는 취학 여부');
  if(!c.date)m.info.push('체험일');
  PARENT_Q.forEach((q,i)=>{if(!isNum(S.parent.a[q.id]))m.parent.push({id:q.id,n:i+1})});
  TEACHER_Q.forEach((q,i)=>{const v=S.teacher.a[q.id];if(!(isNum(v)||v==='na'))m.teacher.push({id:q.id,n:i+1})});
  const x=S.teacher.ctx;
  [['entry','처음 공간에 들어왔을 때의 반응'],['change','수업 초반과 후반의 참여 변화'],['near','보호자와 가까이 있을 때의 참여'],['alt','말 대신 다른 방식으로 의사 표현']].forEach(([k,l])=>{if(!x[k])m.ctx.push({k,l})});
  m.total=m.info.length+m.parent.length+m.teacher.length+m.ctx.length;
  return m;
}

function hexSVG(sc){
  const W=360,H=282,cx=180,cy=140,R=78;
  const ang=i=>(-90+60*i)*Math.PI/180;
  const P=(i,f)=>[cx+R*f*Math.cos(ang(i)),cy+R*f*Math.sin(ang(i))];
  const fr=v=>0.14+0.86*(v-1)/6;
  const poly=pts=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  let s=`<svg class="hex" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="오늘 관찰한 음악 성장 지도. 여섯 영역별로 집·일상과 체험 수업에서 관찰한 모습을 보여 줍니다."><title>오늘 관찰한 음악 성장 지도</title>`;
  [0.34,0.67,1].forEach(f=>{s+=`<polygon points="${poly([0,1,2,3,4,5].map(i=>P(i,f)))}" fill="none" stroke="#D1D8E3" stroke-width="1"/>`});
  for(let i=0;i<6;i++){const p=P(i,1);s+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="${sc[i].extra?'#B9741F':'#D1D8E3'}" stroke-width="1" ${sc[i].extra?'stroke-dasharray="3 3"':''}/>`}
  // 보호자(집·일상): 점선 외곽 + 빈 원
  const pp=sc.map((x,i)=>P(i,fr(x.parent)));
  s+=`<polygon points="${poly(pp)}" fill="none" stroke="#B9741F" stroke-width="1.8" stroke-dasharray="5 3" stroke-linejoin="round"/>`;
  pp.forEach(p=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="#fff" stroke="#B9741F" stroke-width="1.8"/>`});
  // 원장님 관찰: 실선 + 면 (결측은 그리지 않음)
  const tp=sc.map((x,i)=>x.teacher==null?null:P(i,fr(x.teacher)));
  if(tp.every(Boolean)){s+=`<polygon points="${poly(tp)}" fill="#1F7A6B" fill-opacity=".22" stroke="#1F7A6B" stroke-width="2.2" stroke-linejoin="round"/>`}
  else{for(let i=0;i<6;i++){const a=tp[i],b=tp[(i+1)%6];if(a&&b)s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#1F7A6B" stroke-width="2.2" stroke-linecap="round"/>`}}
  tp.forEach(p=>{if(p)s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="#1F7A6B"/>`});
  // 라벨
  for(let i=0;i<6;i++){
    const lp=P(i,1.2),c=Math.cos(ang(i)),anchor=c>0.3?'start':c<-0.3?'end':'middle';
    const dy=i===0?-6:i===3?11:4;
    s+=`<text x="${lp[0].toFixed(1)}" y="${(lp[1]+dy).toFixed(1)}" text-anchor="${anchor}" font-size="12.5" font-weight="700" fill="#1B2A41" font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif">${DOM[i].name}</text>`;
    if(sc[i].extra)s+=`<text x="${lp[0].toFixed(1)}" y="${(lp[1]+dy+13).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" font-weight="700" fill="#B9741F" font-family="Pretendard,Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif">추가 관찰</text>`;
  }
  return s+'</svg>';
}

function fitScale(){
  const w=$('#scaleWrap'),i=$('#scaleIn');
  if(!w||!i)return;
  const pad=28,avail=w.parentElement.clientWidth-pad,sheetW=210*96/25.4,sheetH=297*96/25.4;
  const sc=Math.min(1,avail/sheetW);
  i.style.transform=`scale(${sc})`;w.style.width=(sheetW*sc)+'px';w.style.height=(sheetH*sc)+'px';
  checkFit();
}
function checkFit(){
  const sin=document.querySelector('#scaleIn .sin'),fit=$('#fit');
  if(!sin||!fit)return;
  fit.hidden=!(sin.scrollHeight>sin.clientHeight+2);
}

}
function go(n){
  if(n<1||n>5)return;
  if(S.step<=3)SHOWMISS[S.step]=SHOWMISS[S.step]||(n>S.step);
  S.step=n;save();render();
}
function updateProg(kind){
  const Q=kind==='p'?PARENT_Q:TEACHER_Q,a=kind==='p'?S.parent.a:S.teacher.a;
  const n=Q.filter(q=>isNum(a[q.id])||a[q.id]==='na').length;
  const el=$('#progN');if(el){el.textContent=n;$('#progBar').style.width=(n/Q.length*100)+'%'}
}
function setAnswer(id,val){
  const kind=id[0];
  (kind==='p'?S.parent.a:S.teacher.a)[id]=val;
  const fs=document.getElementById('q-'+id);
  if(fs){
    fs.classList.remove('missing');
    const lab=val==='na'?'관찰 기회 없음':val==null?'':SCALE.find(o=>o.v===val).l;
    fs.querySelector('.sel').innerHTML=lab?'선택: <b>'+lab+'</b>':'';
    fs.querySelectorAll('input[type=radio]').forEach(r=>{r.checked=(String(val)===r.value)});
  }
  updateProg(kind);save();
}
function rerenderSheet(){
  const i=$('#scaleIn');if(!i)return;
  i.innerHTML=sheetHTML();fitScale();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const [act,arg]=b.dataset.act.split(':');
  if(act==='prev')go(S.step-1);
  else if(act==='next')go(S.step+1);
  else if(act==='goto'){$('#dlgReset').close&&0;go(+arg)}
  else if(act==='clr'){setAnswer(arg,undefined);delete (arg[0]==='p'?S.parent.a:S.teacher.a)[arg];const fs=document.getElementById('q-'+arg);fs&&fs.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);updateProg(arg[0]);save()}
  else if(act==='demo-open')$('#dlgDemo').showModal();
  else if(act==='dlg-close')b.closest('dialog').close();
  else if(act==='demo-load'){$('#dlgDemo').close();loadDemo(arg)}
  else if(act==='demo-exit'){MODE='real';S=loadState('real');SHOWMISS[1]=SHOWMISS[2]=SHOWMISS[3]=false;render();toast('실제 기록으로 돌아왔어요')}
  else if(act==='reset-open'){$('#resetMsg').textContent=S.demo?'지금 열려 있는 데모 데이터를 지우고 처음 상태로 돌아갑니다. 실제 기록은 영향받지 않아요.':'지금 입력한 이 아이의 모든 내용(기본 정보, 질문지, 관찰지, 결과지 문장)이 이 기기에서 삭제됩니다. 되돌릴 수 없어요.';$('#dlgReset').showModal()}
  else if(act==='reset-do'){const d=S.demo;S=blank();if(d){MODE='real';S=loadState('real');store.set(KEY.demo,'')}else{store.set(KEY.real,'')}SHOWMISS[1]=SHOWMISS[2]=SHOWMISS[3]=false;$('#dlgReset').close();render();toast('초기화했어요')}
  else if(act==='draft-all'){syncDrafts(true);S.report.confirmed=false;save();render(true);toast('입력값 기준 초안으로 다시 만들었어요')}
  else if(act==='draft-one'){delete S.report.e[arg];syncDrafts(false);save();render(true)}
  else if(act==='print')doPrint();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[type=radio][data-q]')){setAnswer(t.dataset.q,t.value==='na'?'na':+t.value)}
  else if(t.matches('[data-info]')){S.child[t.dataset.info]=t.value;const a=ageInfo();const bx=$('#ageBox');if(bx){bx.innerHTML=ageBox(a);bx.classList.toggle('bad',!!a.warn)}save()}
  else if(t.matches('input[data-ctx]')){S.teacher.ctx[t.dataset.ctx]=t.value;const ch=$('#chips');if(ch)ch.hidden=S.teacher.ctx.alt!=='other';const row=t.closest('.row');row&&row.classList.remove('missing');save()}
  else if(t.matches('input[data-chip]')){const c=S.teacher.ctx.chips,k=t.dataset.chip;S.teacher.ctx.chips=t.checked?[...new Set([...c,k])]:c.filter(x=>x!==k);save()}
  else if(t.matches('[data-r]')){S.report[t.dataset.r]=t.value;if(t.dataset.r==='stage'||t.dataset.r==='count'){syncDrafts(false);syncFormFromState()}save();rerenderSheet()}
  else if(t.id==='confirmChk'){S.report.confirmed=t.checked;$('#printBtn').disabled=!t.checked;save()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-memo]')){S.teacher.m[t.dataset.memo]=t.value;save()}
  else if(t.matches('[data-info="name"]')){S.child.name=t.value;save()}
  else if(t.matches('[data-pf]')){S.parent[t.dataset.pf]=t.value;save()}
  else if(t.matches('[data-cn]')){S.teacher.ctx[t.dataset.cn]=t.value;save()}
  else if(t.matches('[data-f]')){
    const k=t.dataset.f;S.report.f[k]=t.value;S.report.e[k]=true;S.report.confirmed=false;
    const c=$('#cnt-'+k),fd=FIELDS.find(x=>x.k===k);if(c)c.textContent=t.value.length+'/'+fd.max;
    save();rerenderSheet();
  }
});
function syncFormFromState(){
  FIELDS.forEach(f=>{const el=document.getElementById('f-'+f.k);if(el&&!S.report.e[f.k]){el.value=S.report.f[f.k]||'';const c=$('#cnt-'+f.k);if(c)c.textContent=el.value.length+'/'+f.max}});
}
function doPrint(){
  const m=validate();
  if(m.total){toast('빠진 항목이 있어요. 먼저 확인해 주세요');return}
  fillPrintRoot();
  try{window.print()}catch(err){toast('이 화면에서는 인쇄를 열 수 없어요. 파일을 브라우저에서 직접 열어 주세요')}
}
function fillPrintRoot(){
  const m=validate();
  $('#printRoot').innerHTML=m.total?'<p style="padding:20mm;font-size:12pt">결과지는 모든 입력을 마친 뒤 4단계에서 만들 수 있어요.</p>':sheetHTML();
}
window.addEventListener('beforeprint',fillPrintRoot);
function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;store.set(KEY[MODE],JSON.stringify(S))}}
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});
window.addEventListener('resize',()=>fitScale());

/* =========================================================
   데모 데이터 (실제 기록과 분리 저장)
   ========================================================= */
function demoState(k){
  const s=blank();s.demo=k;s.step=1;
  const P=arr=>{arr.forEach((v,i)=>s.parent.a['p'+(i+1)]=v)};
  const T=arr=>{arr.forEach((v,i)=>s.teacher.a['t'+(i+1)]=v)};
  const yr=new Date().getFullYear();
  if(k==='A'){
    s.child={name:'데모 하늘 (예시 A)',birthYear:String(yr-8),grade:'초2',date:todayISO()};
    P([6,6,5, 6,5,6, 5,6,5, 6,5,6, 5,6,5, 6,5,6]);
    T([6,6,5, 6,6,6, 5,6,5, 5,5,6, 5,5,6, 6,6,5]);
    s.teacher.m={t2:'높은 소리와 낮은 소리를 번갈아 들려주자 손을 위아래로 움직여 구분했어요.',t5:'짧은 리듬을 듣고 바로 손뼉으로 따라 쳤어요.',t18:'함께 연주할 때 선생님의 속도에 맞춰 천천히 두드렸어요.'};
    s.teacher.ctx={entry:'direct',change:'steady',near:'same',alt:'words',chips:[],note:''};
    s.parent.cond='컨디션 좋았어요.';
  }else if(k==='B'){
    s.child={name:'데모 서준 (예시 B)',birthYear:String(yr-6),grade:'미취학',date:todayISO()};
    P([5,5,5, 6,6,6, 5,5,4, 6,7,6, 5,5,5, 5,4,5]);
    T([5,5,6, 4,5,5, 4,5,4, 3,4,5, 4,4,4, 4,5,5]);
    s.teacher.m={t10:'처음엔 보호자 옆에서 지켜보기만 했지만 후반에 스스로 북을 골랐어요.',t11:'후반에 먼저 손을 뻗어 처음 보는 악기를 만져 보았어요.'};
    s.teacher.ctx={entry:'parent',change:'grow',near:'near',alt:'other',chips:['가리키기','악기 선택'],note:''};
    s.parent.cond='오늘 낮잠을 못 잤고, 낯선 곳에서는 처음에 조용한 편이에요.';
  }else{
    s.child={name:'데모 지우 (예시 C)',birthYear:String(yr-5),grade:'미취학',date:todayISO()};
    P([5,5,4, 5,4,5, 4,5,5, 5,4,4, 5,5,4, 5,4,5]);
    T([5,6,5, 5,'na',4, 'na','na',4, 'na','na','na', 'na',4,'na', 4,5,'na']);
    s.teacher.m={t14:'곡이 바뀔 때 잠깐 쳐다봤어요.'};
    s.teacher.ctx={entry:'watch',change:'quiet',near:'none',alt:'none',chips:[],note:'수업 시간이 짧아 관찰하지 못한 활동이 있었어요.'};
    s.parent.cond='특이사항 없음.';
  }
  return s;
}
function loadDemo(k){
  MODE='demo';S=demoState(k);syncDrafts(false);store.set(KEY.demo,JSON.stringify(S));
  SHOWMISS[1]=SHOWMISS[2]=SHOWMISS[3]=false;render();toast('데모 '+k+' 를 불러왔어요 (실제 기록과 분리 저장)');
}

/* =========================================================
   시작
   ========================================================= */
S=loadState('real');
if(!S.report.f)S.report.f={};
render();
window.__kmm={get S(){return S},loadDemo,scores,suggestStage,validate,drafts,sheetHTML,go,syncDrafts,fillPrintRoot,setStage:v=>{S.report.stage=v;syncDrafts(false)}};
</script>
</body>
